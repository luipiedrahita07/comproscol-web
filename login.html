<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin – ComprosCol</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--naranja:#E8401A;--naranja-dark:#C23210;--gris-oscuro:#1A1A1A;--borde:#E0E0E0}

body{
  font-family:'Barlow',sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:var(--gris-oscuro);
  position:relative;overflow:hidden
}

/* Fondo decorativo */
.bg-shape{
  position:absolute;width:600px;height:600px;border-radius:50%;
  background:var(--naranja);opacity:.06;pointer-events:none
}
.bg-shape.s1{top:-200px;right:-150px}
.bg-shape.s2{bottom:-250px;left:-200px;width:500px;height:500px}

/* Tarjeta */
.card{
  position:relative;z-index:1;
  background:#fff;border-radius:16px;
  width:100%;max-width:400px;
  padding:2.5rem 2rem;
  box-shadow:0 24px 60px rgba(0,0,0,.4)
}

/* Logo */
.logo{
  font-family:'Barlow Condensed',sans-serif;
  font-size:2rem;font-weight:800;
  color:var(--naranja);text-align:center;
  letter-spacing:-1px;margin-bottom:.25rem
}
.logo span{color:var(--gris-oscuro)}
.subtitle{
  text-align:center;font-size:.8rem;font-weight:600;
  color:#aaa;text-transform:uppercase;letter-spacing:1px;
  margin-bottom:2rem
}

/* Campos */
.field{margin-bottom:1.1rem}
.field label{
  display:block;font-size:.75rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;
  color:#888;margin-bottom:.4rem
}
.field-wrap{position:relative}
.field input{
  width:100%;padding:11px 40px 11px 14px;
  border:1.5px solid var(--borde);border-radius:8px;
  font-family:'Barlow',sans-serif;font-size:.92rem;
  color:var(--gris-oscuro);transition:border-color .2s;background:#fff
}
.field input:focus{outline:none;border-color:var(--naranja)}
.field input.error{border-color:#e53}
.toggle-pass{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;font-size:1rem;color:#bbb;
  transition:color .2s
}
.toggle-pass:hover{color:var(--naranja)}

/* Error msg */
.error-msg{
  background:#fff0f0;border:1px solid #fcc;border-radius:6px;
  padding:9px 14px;font-size:.82rem;color:#c33;font-weight:600;
  margin-bottom:1rem;display:none;align-items:center;gap:8px
}
.error-msg.show{display:flex}

/* Botón */
.btn-login{
  width:100%;padding:13px;background:var(--naranja);color:#fff;
  border:none;border-radius:8px;font-family:'Barlow',sans-serif;
  font-weight:700;font-size:1rem;cursor:pointer;
  transition:background .2s,transform .15s;margin-top:.5rem;
  position:relative;overflow:hidden
}
.btn-login:hover{background:var(--naranja-dark);transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}
.btn-login.loading{pointer-events:none;opacity:.8}
.btn-login .spinner{
  display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto
}
.btn-login.loading .btn-text{display:none}
.btn-login.loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Footer */
.card-footer{
  text-align:center;margin-top:1.5rem;
  font-size:.75rem;color:#bbb
}
.card-footer a{color:var(--naranja);text-decoration:none;font-weight:600}
.card-footer a:hover{text-decoration:underline}

/* Intentos restantes */
.intentos{
  text-align:center;font-size:.75rem;color:#bbb;
  margin-top:.75rem;min-height:18px
}
</style>
</head>
<body>

<div class="bg-shape s1"></div>
<div class="bg-shape s2"></div>

<div class="card">
  <div class="logo">Compros<span>COL</span></div>
  <div class="subtitle">Panel de administración</div>

  <div class="error-msg" id="errorMsg">
    <span></span>
    <span id="errorText">Usuario o contraseña incorrectos</span>
  </div>

  <div class="field">
    <label>Usuario</label>
    <div class="field-wrap">
      <input type="text" id="fUser" placeholder="Tu usuario" autocomplete="username"
        onkeydown="if(event.key==='Enter')intentarLogin()"/>
    </div>
  </div>

  <div class="field">
    <label>Contraseña</label>
    <div class="field-wrap">
      <input type="password" id="fPass" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')intentarLogin()"/>
      <button class="toggle-pass" onclick="togglePass()" tabindex="-1" type="button">Mostrar</button>
    </div>
  </div>

  <button class="btn-login" id="btnLogin" onclick="intentarLogin()">
    <span class="btn-text">Ingresar al panel</span>
    <div class="spinner"></div>
  </button>

  <div class="intentos" id="intentosMsg"></div>

  <div class="card-footer">
    <a href="index.html">← Volver al sitio</a>
  </div>
</div>

<script>
// ── CREDENCIALES ── Cámbialas aquí
const CREDENCIALES = [
  { usuario: 'admin', pass: 'comproscol2021' }
];

const MAX_INTENTOS = 5;
const BLOQUEO_MIN = 5;

let intentosFallidos = parseInt(sessionStorage.getItem('loginFails') || '0');
let bloqueadoHasta = parseInt(sessionStorage.getItem('bloqueadoHasta') || '0');

function estasBloqueado() {
  return bloqueadoHasta > Date.now();
}

function tiempoRestante() {
  return Math.ceil((bloqueadoHasta - Date.now()) / 1000);
}

function mostrarError(msg) {
  const el = document.getElementById('errorMsg');
  document.getElementById('errorText').textContent = msg;
  el.classList.add('show');
  document.getElementById('fUser').classList.add('error');
  document.getElementById('fPass').classList.add('error');
}

function limpiarError() {
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('fUser').classList.remove('error');
  document.getElementById('fPass').classList.remove('error');
}

function actualizarIntentos() {
  const restantes = MAX_INTENTOS - intentosFallidos;
  const msg = document.getElementById('intentosMsg');
  if (intentosFallidos > 0 && !estasBloqueado()) {
    msg.textContent = `${restantes} intento${restantes !== 1 ? 's' : ''} restante${restantes !== 1 ? 's' : ''}`;
    msg.style.color = restantes <= 2 ? '#e53' : '#bbb';
  } else {
    msg.textContent = '';
  }
}

function intentarLogin() {
  limpiarError();

  // Verificar bloqueo
  if (estasBloqueado()) {
    mostrarError(`Bloqueado. Espera ${tiempoRestante()} segundos.`);
    return;
  }

  const user = document.getElementById('fUser').value.trim();
  const pass = document.getElementById('fPass').value;

  if (!user || !pass) {
    mostrarError('Completa usuario y contraseña');
    return;
  }

  // Animación de carga
  const btn = document.getElementById('btnLogin');
  btn.classList.add('loading');

  setTimeout(() => {
    btn.classList.remove('loading');

    const valido = CREDENCIALES.some(c => c.usuario === user && c.pass === pass);

    if (valido) {
      sessionStorage.setItem('adminAuth', 'true');
      sessionStorage.removeItem('loginFails');
      sessionStorage.removeItem('bloqueadoHasta');
      btn.textContent = 'Acceso concedido...';
      btn.style.background = '#2e7d32';
      setTimeout(() => window.location.href = 'admin.html', 600);
    } else {
      intentosFallidos++;
      sessionStorage.setItem('loginFails', intentosFallidos);

      if (intentosFallidos >= MAX_INTENTOS) {
        const hasta = Date.now() + BLOQUEO_MIN * 60 * 1000;
        sessionStorage.setItem('bloqueadoHasta', hasta);
        bloqueadoHasta = hasta;
        mostrarError(`Demasiados intentos. Bloqueado por ${BLOQUEO_MIN} minutos.`);
        document.getElementById('intentosMsg').textContent = '';
        // Contador regresivo
        const iv = setInterval(() => {
          if (!estasBloqueado()) { clearInterval(iv); actualizarIntentos(); limpiarError(); }
          else mostrarError(`Bloqueado. Espera ${tiempoRestante()} segundos.`);
        }, 1000);
      } else {
        mostrarError('Usuario o contraseña incorrectos');
        actualizarIntentos();
      }
      document.getElementById('fPass').value = '';
      document.getElementById('fPass').focus();
    }
  }, 700);
}

function togglePass() {
  const f = document.getElementById('fPass');
  f.type = f.type === 'password' ? 'text' : 'password';
}

// Si ya está autenticado, ir directo al admin
if (sessionStorage.getItem('adminAuth')) {
  window.location.href = 'admin.html';
}

actualizarIntentos();
document.getElementById('fUser').focus();
</script>
</body>
</html>
