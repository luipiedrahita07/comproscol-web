<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin – ComprosCol</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --naranja:#E8401A;
  --naranja-dark:#C23210;
  --gris-oscuro:#1A1A1A;
  --gris-medio:#4A4A4A;
  --gris-claro:#F5F5F3;
  --borde:#E0E0E0;
}
body{font-family:'Barlow',sans-serif;background:var(--gris-claro);color:var(--gris-oscuro);min-height:100vh}

header{
  background:var(--gris-oscuro);padding:0 2rem;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:3px solid var(--naranja);position:sticky;top:0;z-index:100
}
.header-logo{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:800;color:#fff}
.header-logo span{color:var(--naranja)}
.header-count{font-size:.82rem;color:rgba(255,255,255,.5)}

.layout{display:grid;grid-template-columns:420px 1fr;min-height:calc(100vh - 60px)}

/* ── FORMULARIO ── */
.panel-form{
  background:#fff;border-right:1px solid var(--borde);
  padding:1.75rem;overflow-y:auto;height:calc(100vh - 60px);
  position:sticky;top:60px
}
.panel-form h2{
  font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;font-weight:700;
  color:var(--naranja);text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:1.5rem;padding-bottom:.75rem;border-bottom:2px solid var(--gris-claro)
}
.form-group{margin-bottom:1rem}
.form-group label{
  display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.6px;color:var(--gris-medio);margin-bottom:.4rem
}
.form-group input,
.form-group textarea,
.form-group select{
  width:100%;padding:9px 12px;border:1.5px solid var(--borde);border-radius:6px;
  font-family:'Barlow',sans-serif;font-size:.88rem;color:var(--gris-oscuro);
  transition:border-color .2s;background:#fff
}
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{outline:none;border-color:var(--naranja)}
.form-group textarea{resize:vertical;min-height:80px}

/* Drop zone */
.drop-zone{
  width:100%;border:2px dashed var(--borde);border-radius:8px;
  background:var(--gris-claro);cursor:pointer;transition:all .2s;
  padding:1.5rem 1rem;text-align:center;margin-top:.4rem
}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--naranja);background:#fff5f2}
.drop-icon{font-size:2rem;display:block;margin-bottom:.3rem}
.drop-text{display:block;font-size:.84rem;font-weight:600;color:var(--gris-oscuro);margin-bottom:.2rem}
.drop-sub{display:block;font-size:.73rem;color:#aaa}

/* Preview */
.img-preview-gallery {
  margin-top: .8rem;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.img-thumb-wrap {
  position: relative;
  width: 80px;
  height: 80px;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--borde);
}
.img-thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.img-thumb-remove {
  position: absolute;
  top: 4px;
  right: 4px;
  background: rgba(232, 64, 26, 0.9);
  color: #fff;
  border: none;
  border-radius: 4px;
  width: 20px;
  height: 20px;
  font-size: .7rem;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}


/* Barra tamaño */
.size-bar{display:none;align-items:center;gap:8px;margin-top:.4rem}
.size-bar-label{font-size:.72rem;color:var(--gris-medio);min-width:60px}
.size-bar-track{flex:1;height:5px;background:var(--borde);border-radius:3px;overflow:hidden}
.size-bar-fill{height:100%;background:var(--naranja);border-radius:3px;transition:width .3s}

/* Specs */
.specs-list{margin-top:.5rem}
.spec-row{display:grid;grid-template-columns:1fr 1fr 28px;gap:6px;margin-bottom:6px;align-items:center}
.spec-row input{margin:0}
.btn-rm-spec{background:none;border:none;cursor:pointer;color:#bbb;font-size:1rem;transition:color .15s}
.btn-rm-spec:hover{color:var(--naranja)}
.btn-add-spec{
  background:none;border:1.5px dashed var(--borde);border-radius:5px;
  padding:6px 12px;font-size:.78rem;font-weight:600;color:var(--gris-medio);
  cursor:pointer;width:100%;margin-top:4px;font-family:'Barlow',sans-serif;transition:all .2s
}
.btn-add-spec:hover{border-color:var(--naranja);color:var(--naranja)}

/* Stock toggle */
.stock-toggle{display:flex;gap:8px}
.stock-toggle label{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px;border:1.5px solid var(--borde);border-radius:6px;cursor:pointer;
  font-size:.82rem;font-weight:600;color:var(--gris-medio);transition:all .2s
}
.stock-toggle input[type=radio]{display:none}
.stock-toggle input[type=radio]:checked + label{border-color:var(--naranja);background:#fff5f2;color:var(--naranja)}

.btn-guardar{
  width:100%;padding:12px;background:var(--naranja);color:#fff;border:none;
  border-radius:7px;font-family:'Barlow',sans-serif;font-weight:700;font-size:.95rem;
  cursor:pointer;margin-top:1rem;transition:background .2s
}
.btn-guardar:hover{background:var(--naranja-dark)}
.btn-limpiar{
  width:100%;padding:9px;background:none;color:var(--gris-medio);border:1.5px solid var(--borde);
  border-radius:7px;font-family:'Barlow',sans-serif;font-weight:600;font-size:.85rem;
  cursor:pointer;margin-top:.5rem;transition:all .2s
}
.btn-limpiar:hover{border-color:var(--gris-oscuro);color:var(--gris-oscuro)}

/* ── LISTA ── */
.panel-list{padding:1.75rem}
.panel-list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
.panel-list-header h2{font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;font-weight:700;text-transform:uppercase}
.btn-exp{
  background:var(--gris-oscuro);color:#fff;border:none;padding:10px 18px;border-radius:7px;
  font-family:'Barlow',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;transition:background .2s
}
.btn-exp:hover{background:#333}
.btn-exp.red{background:var(--naranja)}.btn-exp.red:hover{background:var(--naranja-dark)}
.search-bar{
  width:100%;padding:9px 14px;border:1.5px solid var(--borde);border-radius:6px;
  font-family:'Barlow',sans-serif;font-size:.88rem;margin-bottom:1rem;transition:border-color .2s
}
.search-bar:focus{outline:none;border-color:var(--naranja)}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.prod-item{background:#fff;border:1px solid var(--borde);border-radius:10px;overflow:hidden;position:relative;transition:box-shadow .2s}
.prod-item:hover{box-shadow:0 6px 20px rgba(0,0,0,.1)}
.prod-item-img{width:100%;height:120px;object-fit:cover;display:block}
.prod-item-emoji{width:100%;height:120px;display:flex;align-items:center;justify-content:center;font-size:3rem;background:linear-gradient(135deg,#f0f0f0,#e8e8e8)}
.prod-item-body{padding:10px 12px}
.prod-item-cat{font-size:.68rem;font-weight:700;color:var(--naranja);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.prod-item-name{font-size:.84rem;font-weight:600;line-height:1.3;margin-bottom:8px}
.prod-item-actions{display:flex;gap:6px}
.btn-edit{flex:1;padding:6px;border:1.5px solid var(--borde);background:#fff;border-radius:5px;font-size:.74rem;font-weight:600;cursor:pointer;font-family:'Barlow',sans-serif;color:var(--gris-medio);transition:all .2s}
.btn-edit:hover{border-color:var(--naranja);color:var(--naranja)}
.btn-del{padding:6px 10px;border:none;background:#fff0f0;color:#e53;border-radius:5px;font-size:.74rem;cursor:pointer;font-weight:700;transition:all .2s}
.btn-del:hover{background:#e53;color:#fff}
.badge{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:3px;font-size:.63rem;font-weight:700;text-transform:uppercase}
.badge.ok{background:var(--naranja);color:#fff}
.badge.no{background:#999;color:#fff}

.empty{text-align:center;padding:4rem 2rem;color:#bbb;grid-column:1/-1}
.empty span{font-size:3rem;display:block;margin-bottom:.75rem}

/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:999;background:var(--gris-oscuro);color:#fff;
  padding:12px 20px;border-radius:8px;font-size:.88rem;font-weight:600;border-left:4px solid var(--naranja);
  transform:translateY(80px);opacity:0;transition:all .3s
}
.toast.show{transform:translateY(0);opacity:1}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex}
.modal-box{background:#fff;border-radius:12px;width:100%;max-width:680px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
.modal-head{padding:1.25rem 1.5rem;border-bottom:1px solid var(--borde);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:700;text-transform:uppercase}
.modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--gris-medio)}
.modal-body{padding:1.25rem 1.5rem;overflow-y:auto;flex:1}
.modal-body p{font-size:.85rem;color:var(--gris-medio);margin-bottom:1rem}
.code-block{background:#1e1e2e;color:#cdd6f4;border-radius:8px;padding:1.25rem;font-family:'Courier New',monospace;font-size:.76rem;line-height:1.6;overflow-x:auto;white-space:pre;max-height:45vh;overflow-y:auto}
.modal-foot{padding:1rem 1.5rem;border-top:1px solid var(--borde);display:flex;gap:8px;justify-content:flex-end}

@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .panel-form{position:static;height:auto}
}
/* Nuevo carril deslizable para la lista de productos */
.prod-item-gallery {
  display: flex;
  width: 100%;
  height: 120px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  background: #f0f0f0;
}
.prod-item-gallery img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  flex-shrink: 0;
  scroll-snap-align: start;
}
/* Estilizar la barra de desplazamiento para que sea una línea delgada naranja */
.prod-item-gallery::-webkit-scrollbar {
  height: 4px;
}
.prod-item-gallery::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.05);
}
.prod-item-gallery::-webkit-scrollbar-thumb {
  background: var(--naranja);
  border-radius: 2px;
}

/* Carrusel deslizable para la parte superior del modal */
.modal-gallery {
  display: flex;
  width: 100%;
  height: 280px; /* Ajusta esta altura si quieres que se vea más alto o bajo */
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  background: #f3f3f3;
  border-top-left-radius: 16px; /* Para que herede las esquinas redondeadas del modal */
  border-top-right-radius: 16px;
}

.modal-gallery img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  flex-shrink: 0;
  scroll-snap-align: start;
}

/* Línea de scroll delgada y estética para el modal */
.modal-gallery::-webkit-scrollbar {
  height: 5px;
}
.modal-gallery::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.05);
}
.modal-gallery::-webkit-scrollbar-thumb {
  background: #ff4500; /* O la variable de tu color naranja */
  border-radius: 10px;
}
</style>
</head>
<body>

<header>
  <div class="header-logo">Admin <span>ComprosCol</span></div>
  <span class="header-count" id="headerCount">0 productos</span>
</header>

<div class="layout">

  <!-- FORMULARIO -->
  <div class="panel-form">
    <h2 id="formTitle">Agregar Producto</h2>
    <input type="hidden" id="editId"/>

    <div class="form-group">
      <label>Nombre *</label>
      <input type="text" id="fNombre" placeholder="Nombre del producto"/>
    </div>

    <div class="form-group">
      <label>Categoría *</label>
      <select id="fCat">
        <option value="">— Selecciona —</option>
        <option>Protección Craneal</option>
        <option>Protección Visual</option>
        <option>Protección Corporal</option>
        <option>Protección Manual</option>
        <option>Calzado de Seguridad</option>
        <option>Protección Respiratoria</option>
        <option>Protección Auditiva</option>
        <option>Trabajo en Alturas</option>
        <option>Señalización</option>
        <option>Contra Incendios</option>
        <option>Primeros Auxilios</option>
        <option>Área de Alimentos</option>
        <option>Aseo</option>
        <option>Dotación</option>
        <option>Otra</option>
      </select>
    </div>

    <div class="form-group" id="catOtraGroup" style="display:none">
      <label>Nueva categoría</label>
      <input type="text" id="fCatOtra" placeholder="Escribe la categoría"/>
    </div>

    <div class="form-group">
      <label>Descripción *</label>
      <textarea id="fDesc" placeholder="Descripción corta del producto..."></textarea>
    </div>

    <div class="form-group">
      <label>Imágenes del producto (Máx. 5)</label>
      <div class="drop-zone" id="dropZone">
        <span class="drop-icon">📁</span>
        <span class="drop-text">Haz clic o arrastra imágenes aquí</span>
        <span class="drop-sub">JPG · PNG · WEBP — se comprimen automáticamente</span>
        <input type="file" id="fImgFile" accept="image/*" multiple style="display:none"/>
      </div>
      <div class="img-preview-gallery" id="imgPreviewWrap"></div>
    </div>

    <div class="form-group">
      <label>Emoji (si no hay imagen)</label>
      <input type="text" id="fEmoji" placeholder="⛑️" maxlength="4"/>
    </div>

    <div class="form-group">
      <label>Disponibilidad</label>
      <div class="stock-toggle">
        <input type="radio" name="stock" id="stockSi" value="true" checked/>
        <label for="stockSi">Disponible</label>
        <input type="radio" name="stock" id="stockNo" value="false"/>
        <label for="stockNo">Agotado</label>
      </div>
    </div>

    <div class="form-group">
      <label>Especificaciones técnicas</label>
      <div class="specs-list" id="specsList"></div>
      <button class="btn-add-spec" onclick="agregarSpec()">+ Agregar especificación</button>
    </div>

    <button class="btn-guardar" onclick="guardarProducto()">Guardar producto</button>
    <button class="btn-limpiar" onclick="limpiarForm()">Limpiar formulario</button>
  </div>

  <!-- LISTA -->
  <div class="panel-list">
    <div class="panel-list-header">
      <h2>Productos guardados</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-exp" onclick="abrirExport()">Exportar Productos</button>
        <button class="btn-exp red" onclick="borrarTodo()">Borrar todo</button>
      </div>
    </div>
    <input class="search-bar" type="text" id="searchBar" placeholder="Buscar producto..." oninput="renderLista()"/>
    <div class="prod-grid" id="prodGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Modal exportar -->
<div class="modal-bg" id="modalExport">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Exportar → app.js</h3>
      <button class="modal-close" onclick="cerrarExport()">✕</button>
    </div>
    <div class="modal-body">
      <p>Copia este código y <strong>reemplaza el array <code>productos</code></strong> en tu <code>app.js</code>.</p>
      <div class="code-block" id="codeBlock"></div>
    </div>
    <div class="modal-foot">
      <button class="btn-guardar" style="width:auto;margin:0;padding:10px 22px" onclick="copiarCodigo()"> Copiar</button>
      <button class="btn-limpiar" style="width:auto;margin:0;padding:10px 22px" onclick="cerrarExport()">Cerrar</button>
    </div>
  </div>
</div>

<script>
// ── STORAGE ──
const KEY = 'comproscol_productos';
const cargar = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const guardarLS = arr => localStorage.setItem(KEY, JSON.stringify(arr));

// ── IMAGEN: compresión desde dispositivo ──
const MAX_W = 600, MAX_KB = 40;

function comprimirImagen(file, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      let q = 0.85, b64 = canvas.toDataURL('image/jpeg', q);
      while (b64.length > MAX_KB * 1024 * 1.37 && q > 0.3) {
        q -= 0.1;
        b64 = canvas.toDataURL('image/jpeg', q);
      }
      cb(b64);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ── MANEJO DE MÚLTIPLES IMÁGENES (NUEVO) ──
let imagenesActuales = [];

function renderizarGaleria() {
  const wrap = document.getElementById('imgPreviewWrap');
  const dz = document.getElementById('dropZone');
  
  wrap.innerHTML = imagenesActuales.map((imgB64, index) => `
    <div class="img-thumb-wrap">
      <img src="${imgB64}" alt="preview ${index + 1}"/>
      <button type="button" class="img-thumb-remove" onclick="quitarImagenIndex(${index})">✕</button>
    </div>
  `).join('');

  // Ocultar dropzone si ya alcanzamos las 5 imágenes
  dz.style.display = imagenesActuales.length >= 5 ? 'none' : 'block';
}

function quitarImagenIndex(index) {
  imagenesActuales.splice(index, 1);
  renderizarGaleria();
  document.getElementById('fImgFile').value = ''; 
}

function procesarArchivos(files) {
  const API_KEY = 'e50d23f6c639d45bdc1c30bdee995768'; // ← Asegúrate de que tenga tu clave
  
  Array.from(files).forEach(file => {
    if (imagenesActuales.length >= 5) {
      toast('⚠️ Máximo 5 imágenes permitidas', true);
      return;
    }
    
    if (file && file.type.startsWith('image/')) {
      const formData = new FormData();
      formData.append('image', file);

      fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
        method: 'POST',
        body: formData
      })
      .then(res => {
        if (!res.ok) throw new Error('Error al subir');
        return res.json();
      })
      .then(response => {
        const urlInternet = response.data.url;
        imagenesActuales.push(urlInternet);
        renderizarGaleria();
      })
      .catch(err => {
        console.error(err);
        alert('❌ No se pudo subir la imagen.');
      });
    }
  });
}
// ── SPECS ──
function agregarSpec(k = '', v = '') {
  const lista = document.getElementById('specsList');
  const d = document.createElement('div');
  d.className = 'spec-row';
  d.innerHTML = `
    <input type="text" placeholder="Clave (ej: Norma)" value="${k}" class="sk"/>
    <input type="text" placeholder="Valor (ej: ANSI Z89.1)" value="${v}" class="sv"/>
    <button class="btn-rm-spec" onclick="this.parentElement.remove()">✕</button>`;
  lista.appendChild(d);
}

function leerSpecs() {
  return [...document.querySelectorAll('#specsList .spec-row')].map(r => [
    r.querySelector('.sk').value.trim(),
    r.querySelector('.sv').value.trim()
  ]).filter(([k, v]) => k || v);
}

// ── GUARDAR ──
function guardarProducto() {
  const nombre = document.getElementById('fNombre').value.trim();
  const catSel = document.getElementById('fCat').value;
  const catOtra = document.getElementById('fCatOtra').value.trim();
  const cat = catSel === 'Otra' ? catOtra : catSel;
  const desc = document.getElementById('fDesc').value.trim();
  const emoji = document.getElementById('fEmoji').value.trim() || '📦';
  const stock = document.querySelector('input[name=stock]:checked').value === 'true';
  const specs = leerSpecs();
  const editId = document.getElementById('editId').value;

  if (!nombre || !cat || !desc) { toast('⚠️ Completa nombre, categoría y descripción', true); return; }

  const lista = cargar();
  if (editId) {
    const i = lista.findIndex(p => p.id === parseInt(editId));
    if (i !== -1) { 
      lista[i] = { ...lista[i], nombre, cat, desc, imagenes: [...imagenesActuales], emoji, stock, specs }; 
    }
  } else {
    const maxId = lista.length ? Math.max(...lista.map(p => p.id)) : 0;
    lista.push({ id: maxId + 1, nombre, cat, desc, imagenes: [...imagenesActuales], emoji, stock, specs });
  }
  guardarLS(lista);
  toast(editId ? '✅ Producto actualizado' : '✅ Producto guardado');
  limpiarForm();
  renderLista();
}

// ── LIMPIAR ──
function limpiarForm() {
  ['editId','fNombre','fDesc','fCatOtra','fEmoji', 'fImgFile'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fCat').value = '';
  document.getElementById('catOtraGroup').style.display = 'none';
  document.querySelector('input[name=stock][value=true]').checked = true;
  document.getElementById('specsList').innerHTML = '';
  document.getElementById('formTitle').textContent = '➕ Agregar Producto';
  
  imagenesActuales = [];
  renderizarGaleria();
}

// ── EDITAR ──
function editarProducto(id) {
  const p = cargar().find(x => x.id === id);
  if (!p) return;
  document.getElementById('editId').value = p.id;
  document.getElementById('fNombre').value = p.nombre;
  document.getElementById('fDesc').value = p.desc;
  document.getElementById('fEmoji').value = p.emoji || '';
  document.querySelector(`input[name=stock][value=${p.stock}]`).checked = true;
  document.getElementById('formTitle').textContent = '✏️ Editando producto';

  if (p.imagenes && p.imagenes.length > 0) {
    imagenesActuales = [...p.imagenes];
  } else if (p.img) {
    imagenesActuales = [p.img]; 
  } else {
    imagenesActuales = [];
  }
  renderizarGaleria();

  const sel = document.getElementById('fCat');
  const opts = [...sel.options].map(o => o.value);
  if (opts.includes(p.cat)) { sel.value = p.cat; }
  else { sel.value = 'Otra'; document.getElementById('fCatOtra').value = p.cat; document.getElementById('catOtraGroup').style.display = 'block'; }

  document.getElementById('specsList').innerHTML = '';
  (p.specs || []).forEach(([k, v]) => agregarSpec(k, v));
  document.querySelector('.panel-form').scrollTo({ top: 0, behavior: 'smooth' });
}

// ── ELIMINAR ──
function eliminarProducto(id) {
  if (!confirm('¿Eliminar este producto?')) return;
  guardarLS(cargar().filter(p => p.id !== id));
  renderLista();
  toast('🗑️ Eliminado');
}

function borrarTodo() {
  if (!confirm('¿Borrar TODOS los productos?')) return;
  localStorage.removeItem(KEY);
  renderLista();
  toast('🗑️ Todo eliminado');
}
// ── RENDER LISTA ACTUALIZADO CON CARRIL DE IMÁGENES ──
function renderLista() {
  const todos = cargar();
  const q = document.getElementById('searchBar').value.toLowerCase();
  const lista = q ? todos.filter(p => p.nombre.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q)) : todos;
  document.getElementById('headerCount').textContent = `${todos.length} producto${todos.length !== 1 ? 's' : ''}`;
  const grid = document.getElementById('prodGrid');
  
  if (lista.length === 0) {
    grid.innerHTML = `<div class="empty"><span>📭</span><p>${q ? 'Sin resultados.' : 'Aún no hay productos.<br>¡Agrega el primero!'}</p></div>`;
    return;
  }
  
  grid.innerHTML = lista.map(p => `
    <div class="prod-item">
      
      ${p.imagenes && p.imagenes.length > 0
        ? `<div class="prod-item-gallery">
            ${p.imagenes.map(img => `<img src="${img}" alt="${p.nombre}"/>`).join('')}
           </div>`
        : (p.img 
          ? `<div class="prod-item-gallery"><img src="${p.img}" alt="${p.nombre}"/></div>`
          : `<div class="prod-item-emoji">${p.emoji || '📦'}</div>`
        )}
        
      <span class="badge ${p.stock ? 'ok' : 'no'}">${p.stock ? 'Stock' : 'Agotado'}</span>
      <div class="prod-item-body">
        <div class="prod-item-cat">${p.cat}</div>
        <div class="prod-item-name">${p.nombre}</div>
        <div class="prod-item-actions">
          <button class="btn-edit" onclick="editarProducto(${p.id})">✏️ Editar</button>
          <button class="btn-del" onclick="eliminarProducto(${p.id})">✕</button>
        </div>
      </div>
    </div>`).join('');
}

// ── EXPORTAR ──
function abrirExport() {
  const lista = cargar();
  if (!lista.length) { toast('⚠️ No hay productos para exportar'); return; }
  document.getElementById('codeBlock').textContent = `const productos = ${JSON.stringify(lista, null, 2)};`;
  document.getElementById('modalExport').classList.add('open');
}
function cerrarExport() { document.getElementById('modalExport').classList.remove('open'); }
function copiarCodigo() {
  navigator.clipboard.writeText(document.getElementById('codeBlock').textContent)
    .then(() => toast('📋 ¡Código copiado!'));
}
document.getElementById('modalExport').addEventListener('click', e => {
  if (e.target === document.getElementById('modalExport')) cerrarExport();
});

// ── TOAST ──
let tt;
function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderLeftColor = err ? '#e53' : 'var(--naranja)';
  el.classList.add('show');
  clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove('show'), 2800);
}

renderLista();

// ─── TRUCO TEMPORAL DE OPTIMIZACIÓN PROFUNDA ───
async function optimizarAhoraMismo() {
  const KEY = 'comproscol_productos';
  let productos = JSON.parse(localStorage.getItem(KEY)) || [];
  if (!productos.length) return;
  
  const achicarB64 = (b64) => {
    return new Promise((resolve) => {
      if (!b64 || !b64.startsWith('data:image')) return resolve(b64);
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > 600) { h = Math.round(h * 600 / w); w = 600; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.65));
      };
      img.onerror = () => resolve(b64);
      img.src = b64;
    });
  };

  for (let p of productos) {
    if (p.img) p.img = await achicarB64(p.img);
    if (p.imagenes && p.imagenes.length > 0) {
      for (let i = 0; i < p.imagenes.length; i++) {
        p.imagenes[i] = await achicarB64(p.imagenes[i]);
      }
    }
  }
  
  localStorage.setItem(KEY, JSON.stringify(productos));
  // Te avisará con una ventana flotante en la pantalla cuando termine
  alert("¡🎉 LOGRADO! Tus 34 productos han sido comprimidos con éxito. Ya puedes borrar este bloque de código de tu archivo.");
}

// ─── RECONEXIÓN AUTOMÁTICA DE LA CAJA DE IMÁGENES ───
// Este código busca la caja gris y el input oculto del formulario
const cajaGris = document.getElementById('dropZone') || document.querySelector('.drop-zone') || document.getElementById('dropzone');
const inputArchivo = document.getElementById('fileInput') || document.querySelector('input[type="file"]') || document.getElementById('imagenes');

if (cajaGris && inputArchivo) {
    // 1. Reconecta el CLIC: Al tocar la caja gris, se abre el selector de archivos
    cajaGris.onclick = function() {
        inputArchivo.click();
    };

    // 2. Reconecta la SELECCIÓN: Al elegir fotos, se ejecutan en tu función nueva
    inputArchivo.onchange = function(e) {
        if (e.target.files && e.target.files.length > 0) {
            procesarArchivos(e.target.files);
        }
    };

    // 3. Reconecta el ARRASTRE (Drag & Drop) desde Drive o carpetas
    cajaGris.addEventListener('dragover', (e) => {
        e.preventDefault();
    });

    cajaGris.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            procesarArchivos(e.dataTransfer.files);
        }
    });

    console.log("🚀 ¡Caja de imágenes reconectada exitosamente por JavaScript!");
} else {
    console.error("❌ No se pudo encontrar la caja gris o el input en el HTML. Revisa los IDs.");
}
